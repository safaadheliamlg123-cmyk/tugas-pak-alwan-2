
name: Build C++ to EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile C++
        shell: pwsh
        run: |
          g++ "main.cpp" -o "main.exe" -std=c++17 -O2

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: compiled-exe
          path: main.exe
